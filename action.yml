name: 'Sentinel-AI Hybrid Security Gate'
description: 'Offline-First Hybrid AI Security Auditor & Cryptographic Airgap Gate (Google #BuildHybridAI 2026)'
author: 'Benjamin Genda'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Target file or directory to scan'
    required: false
    default: '.'
  engine:
    description: 'Cloud reasoning engine: gemini, muse, or ensemble'
    required: false
    default: 'ensemble'
  generate-report:
    description: 'Whether to generate a formal SOC 2 / GDPR compliance report'
    required: false
    default: 'true'
  sarif-file:
    description: 'Output path for OASIS SARIF v2.1.0 document for GitHub Code Scanning'
    required: false
    default: 'sentinel-results.sarif'

outputs:
  sarif-path:
    description: 'Path to generated OASIS SARIF v2.1.0 document'
  critical-count:
    description: 'Number of critical vulnerabilities detected'

runs:
  using: 'node20'
  main: 'dist/cli/index.js'
