<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />

  <!-- Cyber Grid Subtle Lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="1020" cy="190" r="160" fill="#8b5cf6" opacity="0.10" filter="url(#neonGlow)" />

  <!-- Shield Emblem (Left Side) -->
  <g transform="translate(90, 85)" filter="url(#neonGlow)">
    <!-- Outer Shield Glow -->
    <path d="M100 15 L180 50 C180 140, 100 185, 100 185 C100 185, 20 140, 20 50 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.9" />
    
    <!-- Inner Shield Body -->
    <path d="M100 25 L170 56 C170 132, 100 172, 100 172 C100 172, 30 132, 30 56 Z" 
          fill="url(#shieldGrad)" opacity="0.85" />
    
    <!-- Lock / Airgap Symbol Inside Shield -->
    <!-- Shackle -->
    <path d="M85 85 V70 C85 62, 115 62, 115 70 V85" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="75" y="85" width="50" height="40" rx="6" fill="#ffffff" />
    <!-- Keyhole -->
    <circle cx="100" cy="100" r="4" fill="#1e3a8a" />
    <path d="M98 102 L96 114 H104 L102 102 Z" fill="#1e3a8a" />
  </g>

  <!-- Typography & Headers (Right of Shield) -->
  <g transform="translate(330, 75)">
    <!-- Hackathon Track Pill -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#22c55e" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
      GOOGLE #BUILDHYBRIDAI 2026 OFFICIAL ENTRY
    </text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1" filter="url(#subtleGlow)">
      SENTINEL-AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="-0.2">
      Offline-First Autonomous Hybrid Security Auditor
    </text>

    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Cryptographic Secret Vaulting • Cross-File Taint Graphs • Deep Reasoning with Meta Muse Spark 1.3 &amp; Gemini
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Zero Leaks -->
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
      <text x="75" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">
        🛡️ 0% SECRET LEAKAGE
      </text>

      <!-- Pill 2: 23/23 Tests -->
      <rect x="160" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="232" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
        ✔ 23/23 TESTS PASSING
      </text>

      <!-- Pill 3: SARIF 2.1.0 -->
      <rect x="315" y="0" width="140" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="385" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">
        📋 OASIS SARIF v2.1.0
      </text>

      <!-- Pill 4: SOC 2 -->
      <rect x="465" y="0" width="155" height="30" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
      <text x="542" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#e879f9" text-anchor="middle">
        📜 SOC 2 / GDPR CERTIFIED
      </text>
    </g>

    <!-- Architecture Pipeline Preview -->
    <g transform="translate(0, 222)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">
        PIPELINE: [Source Code] ➔ [Local Vault &amp; Airgap] ➔ [Cloud Reasoner: Muse Spark / Gemini] ➔ [Local Rehydration]
      </text>
    </g>
  </g>
</svg>
