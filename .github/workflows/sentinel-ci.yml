name: Sentinel-AI CI & Airgap Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-airgap-and-tests:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run 100% Green Native Test Harness
        run: npm test

      - name: Execute Architectural Benchmark
        run: node dist/cli/index.js benchmark

      - name: Run Offline Airgap Scan
        run: node dist/cli/index.js scan sample/vulnerable-app.ts

      - name: Generate OASIS SARIF v2.1.0 Security Report
        run: node dist/cli/index.js sarif sample/vulnerable-app.ts --out=sentinel-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: sentinel-results.sarif
